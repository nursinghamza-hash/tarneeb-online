name: Build Tarneeb Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Android Platform Files & Build APK
        working-directory: ./flutter_app
        run: |
          flutter create . --project-name tarneeb_online --org com.tarneeb.online
          flutter pub get
          flutter build apk --release

      - name: Upload Ready Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarneeb-Online-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
