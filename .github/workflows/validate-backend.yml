name: Validate Tarneeb Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/validate-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/validate-backend.yml"

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/game_rules.js
          node --check backend/game_rules.test.js
      - name: Run Tarneeb rules tests
        run: npm test --prefix backend
      - name: Verify deployed Render health endpoint
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Render health attempt $attempt/6"
            if curl --fail --silent --show-error --max-time 20 https://tarneeb-online-server.onrender.com/health; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Render health could not be confirmed from GitHub Actions."
          exit 1
