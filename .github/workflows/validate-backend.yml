name: Validate Tarneeb Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/validate-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/validate-backend.yml"

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/game_rules.js
          node --check backend/game_rules.test.js
      - name: Run Tarneeb rules tests
        run: npm test --prefix backend
      - name: Verify deployed Render health endpoint
        if: github.event_name == 'push'
        timeout-minutes: 6
        run: |
          for attempt in $(seq 1 24); do
            echo "Render deployment check $attempt/24"
            response="$(curl --fail --silent --show-error --max-time 20 https://tarneeb-online-server.onrender.com/health || true)"
            if [ -n "$response" ]; then
              echo "$response"
              deployed_commit="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'unknown')}catch(_){process.stdout.write('unknown')}})")"
              echo "Render deployed commit: $deployed_commit"
              echo "GitHub commit under validation: $GITHUB_SHA"
              if [ "$deployed_commit" = "$GITHUB_SHA" ]; then
                echo "Render is running the exact commit under validation."
                exit 0
              fi
              echo "Render is healthy but deployment has not reached this commit yet."
            else
              echo "Render health endpoint is not responding yet."
            fi
            sleep 15
          done
          echo "::error::Render did not deploy the exact GitHub commit within six minutes."
          exit 1
