
name: Build Current Tarneeb APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-current-tarneeb-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-tarneeb-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: flutter_app/pubspec.lock

      - name: Generate Android platform files
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name tarneeb_online --org com.tarneeb.online .

      - name: Configure Android app label and network permissions
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()

          # Add required online permissions inside the manifest root.
          for permission in ("android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"):
              if permission not in manifest:
                  root = re.search(r"<manifest\\b[^>]*>", manifest)
                  if not root:
                      raise SystemExit("Invalid AndroidManifest.xml: manifest tag not found")
                  insert_at = root.end()
                  line = '\\n    <uses-permission android:name="' + permission + '"/>'
                  manifest = manifest[:insert_at] + line + manifest[insert_at:]

          # Set the launcher name shown below the app icon.
          app = re.search(r"<application\\b[^>]*>", manifest)
          if not app:
              raise SystemExit("Invalid AndroidManifest.xml: application tag not found")
          app_tag = app.group(0)
          if re.search(r'android:label="[^"]*"', app_tag):
              app_tag = re.sub(r'android:label="[^"]*"', 'android:label="تحدي الطرنيب"', app_tag, count=1)
          else:
              app_tag = app_tag[:-1] + ' android:label="تحدي الطرنيب">'
          manifest = manifest[:app.start()] + app_tag + manifest[app.end():]

          path.write_text(manifest)
          print(manifest)
          PY

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --dart-define=SERVER_URL=https://tarneeb-online-server.onrender.com

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarneeb-Online-Current-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
