name: Build Tarneeb Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform and build APK
        working-directory: ./flutter_app
        run: |
          flutter create . --project-name tarneeb_online --org com.tarneeb.online
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          text = text.replace('android:label="tarneeb_online"', 'android:label="طرنيب أونلاين"')
          manifest.write_text(text)
          PY
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarneeb-Online-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
